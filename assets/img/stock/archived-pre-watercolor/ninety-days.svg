<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Ninety-day delivery sequence versus nine days">
  <rect width="960" height="280" fill="#F4F1EA"/>
  <text x="24" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C5C">C-08 · SEQUENCE · FLORIDA HOUSE</text>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#111">
    <text x="24" y="70">PERMIT</text>
    <text x="180" y="70">SLAB</text>
    <text x="320" y="70">FRAME</text>
    <text x="470" y="70">DRY-IN</text>
    <text x="620" y="70">MEP</text>
    <text x="760" y="70">C/O</text>
  </g>
  <!-- 90 day bar -->
  <text x="24" y="110" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C5C">90 DAYS — conventional, code-compliant</text>
  <rect x="24" y="122" width="900" height="16" fill="none" stroke="#111" stroke-width="1.25"/>
  <rect x="24" y="122" width="150" height="16" fill="#E8E4DB" stroke="#111"/>
  <rect x="174" y="122" width="140" height="16" fill="#111"/>
  <rect x="314" y="122" width="150" height="16" fill="#E8E4DB" stroke="#111"/>
  <rect x="464" y="122" width="140" height="16" fill="#111"/>
  <rect x="604" y="122" width="140" height="16" fill="#E8E4DB" stroke="#111"/>
  <rect x="744" y="122" width="180" height="16" fill="#111"/>
  <!-- 9 day bar -->
  <text x="24" y="180" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C5C">9 DAYS — the pitch</text>
  <rect x="24" y="192" width="90" height="16" fill="#111"/>
  <text x="124" y="204" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C5C">inspections, trades, and weather do not compress by 10×</text>
  <text x="24" y="248" font-family="ui-monospace, monospace" font-size="11" fill="#5C5C5C">The gap is not software. It is the work that still happens on the lot.</text>
</svg>
